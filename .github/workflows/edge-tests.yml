name: Edge function tests

# The classifier's pure helpers (preClassify, body truncation, party identity)
# encode years of production bug fixes. Until now nothing stopped a change from
# quietly undoing one — the first signal was the user seeing a wrong task.
#
# Runs on every push and PR, before "Deploy to Supabase" ships anything: no
# secrets, no network, a couple of seconds.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: deno test (ai-process)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests
        run: deno test supabase/functions/ai-process/

      # `deno test` only loads the modules the tests import, so a broken import
      # in index.ts itself would sail past it and ship to Supabase. index.ts is
      # excluded here only because its `jsr:` edge-runtime types pull an npm
      # dependency this job has no node_modules for — the modules and tests are
      # where the moved code actually lives.
      - name: Type-check the extracted modules
        run: |
          deno check \
            supabase/functions/ai-process/message-body.ts \
            supabase/functions/ai-process/preclassify.ts \
            supabase/functions/ai-process/party-identity.ts \
            supabase/functions/ai-process/*_test.ts
